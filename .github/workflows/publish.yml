name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest
      - run: npm ci
      - name: Verify VERSION file, package.json, and release tag agree
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          FILE_VERSION=$(tr -d '[:space:]' < skills/git-agents/VERSION)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$FILE_VERSION" ] || [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json=$PKG_VERSION VERSION=$FILE_VERSION tag=$GITHUB_REF_NAME"
            exit 1
          fi
      - name: Configure git identity for the test suite
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
      - run: npm run check
      - run: npm publish
